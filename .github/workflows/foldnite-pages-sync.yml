name: Build Foldnite Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Foldnite/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-foldnite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download public UEFN-QFOLDIT source archive
        run: |
          mkdir -p .build
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/qfoldit/UEFN-QFOLDIT/archive/refs/heads/main.zip \
            -o .build/uefn-qfoldit.zip
          unzip -q .build/uefn-qfoldit.zip -d .build
          mv .build/UEFN-QFOLDIT-main .build/UEFN-QFOLDIT
          rm .build/uefn-qfoldit.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .build/UEFN-QFOLDIT/frontend/package.json

      - name: Install frontend dependencies
        working-directory: .build/UEFN-QFOLDIT/frontend
        run: npm install --no-audit --no-fund

      - name: Create GitHub Pages browser shims
        working-directory: .build/UEFN-QFOLDIT/frontend
        run: |
          mkdir -p static-shims
          cat > static-shims/tauri-core.js <<'EOF'
          const state = window.__qfolditStaticState ??= {
            actions: [],
            proposals: [],
            narrativeContracts: new Map(),
            toolPermissions: [],
          };

          export async function invoke(command, args = {}) {
            switch (command) {
              case 'list_actions':
                return state.actions;
              case 'configure_tool':
                state.toolPermissions.push(args.permission ?? {});
                return { status: 'configured', permission: args.permission ?? null };
              case 'create_action': {
                const action = {
                  action_id: `action-${Date.now()}`,
                  action_type: args.actionType ?? 'unknown',
                  actor_type: args.actorType ?? 'HUMAN',
                  actor_id: args.actorId ?? 'local-user',
                  mission_id: args.missionId ?? 'demo-mission',
                  scientific_object_id: args.scientificObjectId ?? 'protein.example',
                  state_id: args.stateId ?? 'state-0001',
                  parent_state_id: args.parentStateId ?? null,
                  schema_version: args.schemaVersion ?? '1.0',
                  action_payload: args.actionPayload ?? {},
                  runtime_id: args.runtimeId ?? 'WEB',
                  adapter_version: args.adapterVersion ?? 'github-pages',
                  created_at: new Date().toISOString(),
                };
                state.actions.push(action);
                return action;
              }
              case 'submit_proposal': {
                const proposal = {
                  proposal_id: args.proposalId ?? `proposal-${Date.now()}`,
                  action_type: args.actionType ?? 'propose_move',
                  approval: 'PENDING',
                  mission_id: args.missionId ?? 'demo-mission',
                  actor_id: args.actorId ?? 'ai-agent-demo',
                  payload: args.payload ?? {},
                  created_at: new Date().toISOString(),
                };
                state.proposals.push(proposal);
                return proposal;
              }
              case 'decide_proposal': {
                const proposal = state.proposals.find((item) => item.proposal_id === args.proposalId);
                if (proposal) {
                  proposal.approval = args.approved ? 'APPROVED' : 'REJECTED';
                  proposal.decision_reason = args.reason ?? '';
                  proposal.decided_at = new Date().toISOString();
                }
                return proposal ?? { proposal_id: args.proposalId, approval: args.approved ? 'APPROVED' : 'REJECTED' };
              }
              case 'get_narrative_contract':
                return state.narrativeContracts.get(args.missionId) ?? null;
              case 'upsert_narrative_contract': {
                const contract = args.contract ?? null;
                if (contract?.missionId) state.narrativeContracts.set(contract.missionId, contract);
                return contract;
              }
              default:
                return null;
            }
          }
          EOF

          cat > vite.pages.config.mjs <<'EOF'
          import { defineConfig } from 'vite';
          import { resolve } from 'node:path';

          export default defineConfig({
            base: '/Foldnite/',
            resolve: {
              alias: {
                '@tauri-apps/api/core': resolve(process.cwd(), 'static-shims/tauri-core.js'),
              },
            },
            build: {
              outDir: 'pages-dist',
              emptyOutDir: true,
              sourcemap: false,
            },
          });
          EOF

      - name: Build Foldnite static bundle
        working-directory: .build/UEFN-QFOLDIT/frontend
        run: npx vite build --config vite.pages.config.mjs

      - name: Validate generated bundle
        working-directory: .build/UEFN-QFOLDIT/frontend
        run: |
          test -s pages-dist/index.html
          test -d pages-dist/assets
          test "$(find pages-dist/assets -type f | wc -l)" -ge 1
          grep -q 'Narrative' pages-dist/assets/*.js
          grep -q 'Foldnite' pages-dist/index.html

      - name: Publish Foldnite bundle
        run: |
          rm -rf Foldnite
          mkdir -p Foldnite
          cp -R .build/UEFN-QFOLDIT/frontend/pages-dist/. Foldnite/
          touch .nojekyll
          cat > Foldnite/README.md <<'EOF'
          # qFoldIT Foldnite

          GitHub Pages deployment of the qFoldIT UEFN/Foldnite frontend.

          The bundle is built from the public `qfoldit/UEFN-QFOLDIT` frontend with a GitHub Pages browser runtime shim for Tauri commands.

          Included workspaces include Mission Cockpit, Narrative & Culture, FASTA, LEGO Toolbelt, Verse IDE, Verse Generator, Fortnite Island Studio, and Play Session.
          EOF
          rm -rf .build

      - name: Commit generated Foldnite bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Foldnite .nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build Foldnite frontend from UEFN-QFOLDIT"
          git push
