<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="qFoldIT live game and public scientific mission spectator surface"><title>qFoldIT — Game + Mission Board</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#eef4fb}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05070b}.toggle{position:fixed;right:18px;top:18px;z-index:10;border:1px solid #355075;background:rgba(10,17,28,.9);color:#eef4fb;border-radius:10px;padding:10px 13px;cursor:pointer}.panel{position:fixed;z-index:9;right:18px;top:64px;width:min(430px,calc(100vw - 36px));height:min(72vh,690px);background:rgba(9,14,22,.96);border:1px solid #2b3b54;border-radius:13px;box-shadow:0 18px 60px rgba(0,0,0,.45);display:none;overflow:auto}.panel.open{display:block}.head{padding:14px 15px;border-bottom:1px solid #263449;display:flex;justify-content:space-between;gap:10px}.eyebrow{font-size:9px;letter-spacing:.16em;color:#84a9ff;text-transform:uppercase}.title{font-size:18px;font-weight:800;margin-top:4px}.body{padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{border:1px solid #263449;border-radius:9px;padding:10px;background:#0b1119}.k{font-size:9px;color:#91a0b6;text-transform:uppercase}.n{font-size:18px;font-weight:800;margin-top:5px}.stages{display:grid;gap:7px;margin-top:11px}.stage{border:1px solid #263449;border-radius:8px;padding:9px}.stage strong{font-size:10px}.stage span{display:block;font-size:9px;color:#91a0b6;margin-top:3px}.pass{border-color:#2d6454}.ready{border-color:#516b9d}.pending{border-color:#675432}.badge{font-size:8px;border:1px solid #263449;border-radius:99px;padding:2px 5px;float:right}.pass .badge{color:#58d2aa}.ready .badge{color:#84a9ff}.pending .badge{color:#e7bd6d}.log{margin-top:10px;display:grid;gap:6px}.evt{border-left:2px solid #334864;padding-left:8px;font-size:9px;line-height:1.4}.evt time{color:#91a0b6;font-size:8px}.note{margin-top:11px;border:1px solid #5f4e2c;background:#17130b;color:#dec58d;border-radius:9px;padding:9px;font-size:9px;line-height:1.5}a{color:#a9c5ff}</style></head><body><iframe id="game" src="game.html" title="qFoldIT multiplayer scientific sandbox"></iframe><button class="toggle" id="toggle">🔬 Mission Board</button><aside class="panel" id="panel"><div class="head"><div><div class="eyebrow">PUBLIC SPECTATOR</div><div class="title">Mission Board</div></div><a href="mission-board.html" target="_blank" rel="noreferrer">Open full board ↗</a></div><div class="body"><div class="stats"><div class="card"><div class="k">Mission</div><div class="n" id="mission">—</div></div><div class="card"><div class="k">Mode</div><div class="n" id="mode">—</div></div><div class="card"><div class="k">Evidence</div><div class="n" id="evidence">—</div></div><div class="card"><div class="k">Result</div><div class="n" id="score">—</div></div></div><div class="stages" id="stages"></div><div class="log" id="log"></div><div class="note">Scientific scores are never synthesized. A verified result appears only after real validator evidence and matching mission/submission/action lineage.</div></div></aside><script>const panel=document.getElementById('panel');document.getElementById('toggle').onclick=()=>panel.classList.toggle('open');async function load(){try{const r=await fetch('data/isomorphic-mission-live.json?ts='+Date.now(),{cache:'no-store'});const d=await r.json();document.getElementById('mission').textContent=d.mission_id;document.getElementById('mode').textContent=d.mode;document.getElementById('evidence').textContent=d.evidence?.status||'WAITING';document.getElementById('score').textContent=d.scientific_result==null?'—':'VERIFIED';document.getElementById('stages').innerHTML=d.stages.map(s=>`<div class="stage ${s.state}"><span class="badge">${s.state.toUpperCase()}</span><strong>${s.label}</strong><span>${s.state==='pass'?'Canonical contract complete':s.state==='ready'?'Spectator surface ready':s.state==='configure'?'Awaiting adapter configuration':'Blocked until validator evidence exists'}</span></div>`).join('');document.getElementById('log').innerHTML=(d.event_log||[]).slice().reverse().map(e=>`<div class="evt"><time>${new Date(e.time).toLocaleString()} · ${e.stage}</time><div>${e.message}</div></div>`).join('')}catch(e){document.getElementById('log').textContent='Mission feed unavailable: '+e.message}}load();setInterval(load,10000)</script></body></html>
